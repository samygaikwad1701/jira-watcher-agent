name: CI

# Runs on every PR and every push to main so branch-protection rules can
# gate merges on a green build. Publish workflow is separate and only
# fires on git tags.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & smoke test · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e .

      - name: Byte-compile every module
        run: python -m compileall -q watcher/

      - name: Verify the console script imports and reports its version
        run: |
          watcher --version
          jira-watcher --version
          jira-watcher-agent --version

      - name: Build wheel + sdist
        run: python -m build

      - name: Smoke test the built wheel in a clean venv
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/watcher --version

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff + mypy
        run: pip install ruff mypy

      - name: Ruff (lint + format check)
        run: |
          ruff check watcher/
          ruff format --check watcher/

      - name: Mypy (best-effort — no strict mode)
        run: mypy --ignore-missing-imports watcher/ || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to scan every commit

      # We install the gitleaks binary directly instead of using
      # gitleaks/gitleaks-action@v2, which now requires GITHUB_TOKEN (and a
      # paid license for org-owned repos) — that combination fails on
      # Dependabot PRs because their `secrets` context is restricted.
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan repo for leaked secrets
        run: gitleaks detect --source . --redact --verbose --no-banner
