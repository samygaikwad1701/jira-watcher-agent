name: Publish to PyPI

# Triggered when you push a git tag like `v0.1.0`. The tag must match the
# version in `watcher/__init__.py` (a sanity check runs below); once matched
# the wheel + sdist are built and uploaded to PyPI via trusted publishing —
# no API tokens stored in GitHub secrets.
#
# One-time PyPI setup: configure the trusted publisher at
#   https://pypi.org/manage/account/publishing/
# Repository: samygaikwad1701/jira-watcher-agent
# Workflow filename: publish.yml
# Environment name: pypi (matches `environment:` below)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jira-watcher-agent/
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to verify the tag commit is on main

      - name: Verify tag commit is on the main branch
        run: |
          TAG_SHA=$(git rev-list -n 1 "$GITHUB_REF")
          if ! git branch --contains "$TAG_SHA" -r | grep -qE '^\s+origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME points at $TAG_SHA which is not on origin/main."
            echo "Publish only runs for tags on the main branch. Merge to main, then re-tag."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify tag matches watcher.__version__
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import ast, pathlib; \
              m = ast.parse(pathlib.Path('watcher/__init__.py').read_text()); \
              print(next(n.value.value for n in m.body \
                if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          echo "tag=$TAG_VERSION  pkg=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
